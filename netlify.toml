# The site is prebuilt into site/ by src/build.py and committed, so Netlify only publishes it.
[build]
  publish = "site"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# One address for search engines: send the free Netlify address to the real domain.
[[redirects]]
  from = "https://theskiadvisor.netlify.app/*"
  to = "https://theskiadvisor.com/:splat"
  status = 301
  force = true
